[project]
name = "resume-modifier"
version = "0.1.0"
description = "CLI tool for drafting an evidence-based resume from Markdown career history and exporting it with Microsoft Word."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "pymupdf>=1.24.0",
  "python-dotenv>=1.0.0",
  "python-docx>=1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "career_history",
  "config",
  "docx_editor",
  "export_pdf",
  "match_client",
  "match_prompts",
  "openai_client",
  "prompts",
  "resume_reader",
  "resume_models",
  "tailor_resume",
  "validate_resume_match",
]
